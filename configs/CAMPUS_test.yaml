_BASE_: "Base-CenterNet.yaml"
MODEL:
  META_ARCHITECTURE: "GTRRCNN"
  CENTERNET:
    USE_DEFORMABLE: True
    NMS_TH_TEST: 0.6
  ROI_HEADS:
    NAME: GTRROIHeads
    PROPOSAL_APPEND_GT: False
    NO_BOX_HEAD: True
  WEIGHTS: 'output/GTR_MOT/GTR_MOT_CAMPUS_10/model_14000.pth'
  ASSO_ON: True
  ASSO_HEAD:
    NEG_UNMATCHED: True
    ASSO_THRESH: 0.25
    ASSO_THRESH_TEST: 0.55
    ASSO_WEIGHT: 1.0
    NUM_WEIGHT_LAYERS: 0
    NO_DECODER_SELF_ATT : False
    NO_ENCODER_SELF_ATT : False
    NUM_DECODER_LAYERS : 1
    NUM_ENCODER_LAYERS : 1
    NUM_FC : 2
    WITH_TEMP_EMB : False
    WITH_PLUS_EMB : False
    NO_POS_EMB : True
    WITH_CAMERA_EMB : False
    WITH_ATTENTION : False
    WITH_CAT : True
    CAT_DIM : 128
    CENTER : False
    WITH_BANK : True
    THRED : 0.15
    BANK_SIZE : 20
    NUM_HEADS : 8
SOLVER:
  USE_CUSTOM_SOLVER: True
  MAX_ITER: 20000
  LR_SCHEDULER_NAME: "WarmupCosineLR"
  BASE_LR: 0.00005
  OPTIMIZER: ADAMW
  IMS_PER_BATCH: 1
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.1
    NORM_TYPE: 2.0
  BACKBONE_MULTIPLIER: 0.1
INPUT:
  FORMAT: RGB
  CUSTOM_AUG: EfficientDetResizeCrop
  TRAIN_SIZE: 1280
  NOT_CLAMP_BOX: True
  TEST_INPUT_TYPE: square
  TEST_SIZE: 1560
  VIDEO:
    TRAIN_LEN: 9
    TEST_LEN: 30
VIDEO_INPUT: True
VIDEO_TEST:
  MAX_CENTER_DIST: -1.0
  OVERLAP_THRESH: 0.1
  DECAY_TIME: -1.0
  WITH_IOU: False
  NOT_MULT_THRESH: False
  MIN_TRACK_LEN : 50
DATASETS:
  TRAIN: ("campus_stage1",)
  TEST: ("campus_test",)
FIND_UNUSED_PARAM: True
DATALOADER:
  SAMPLER_TRAIN: "MultiDatasetSampler"
  SOURCE_AWARE: True
  DATASET_RATIO: [1]
REID : False
